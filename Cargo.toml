[package]
name = "mipsorcu"
version = "0.1.0"
edition = "2024"

[dependencies]
chacha20poly1305 = "0.10.1"
getrandom = "0.4.2"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
uuid = "1.23.1"
zeroize = "1.8.2"

[dev-dependencies]
proptest = "1.11.0"
