[package]
name = "mipsorcu"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8", features = ["json"] }
chacha20poly1305 = "0.10.1"
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["fast", "std", "zeroize"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
getrandom = "0.4.2"
hex = "0.4"
http = "1"
# rust_crypto feature pulls in rsa crate (RUSTSEC-2023-0071). See .cargo/audit.toml
# for suppression justification. Only RS256 verification (public key) is used.
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
libc = "0.2"
reqwest = { version = "0.13", features = ["rustls", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["trace", "sensitive-headers"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = "1.23.1"
zeroize = "1.8.2"

[dev-dependencies]
proptest = "1.11.0"
tokio = { version = "1", features = ["test-util"] }
