[package]
name = "mipsorcu-orchestrator"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
reqwest = { version = "0.13", features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha3 = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1"] }
uuid = { version = "1.29.2", features = ["v4"] }
