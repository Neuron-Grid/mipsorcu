name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
          key: ${{ runner.os }}-cargo-1.95-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.95-
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy && rustup default 1.95.0
      - run: bash scripts/check-core.sh rust

  supabase:
    name: Supabase validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@d239d1052f6f024a8d746d7e5aeddead63b9cb53 # v3.1.0
        with:
          # Keep CLI v2 until supabase/config.toml migrates from [inbucket] to [local_smtp].
          version: 2.122.1
      - run: supabase start > /dev/null
      - run: bash scripts/check-core.sh db

  orchestrator:
    name: Orchestrator validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy && rustup default 1.95.0
      - run: cargo fmt --manifest-path orchestrator/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path orchestrator/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --locked --manifest-path orchestrator/Cargo.toml

  orchestrator_postgres:
    name: Disposable orchestrator PostgreSQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0
      - run: cargo fetch --locked --manifest-path orchestrator/Cargo.toml
      - run: docker pull rust@sha256:d7482085ff5b415f84dba5647ae71606650bdef00db7aeb69f4b3d170c3e4082
      - run: docker pull postgres@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
      - run: bash scripts/test-orchestrator-offline-container.sh postgres-tests

  cargo_deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo deny --locked check

  cargo_vet:
    name: cargo-vet
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0
      - run: cargo install --locked cargo-vet --version 0.10.2
      - run: cargo vet --locked --no-minimize-exemptions
      - if: ${{ always() }}
        run: python3 scripts/check-cargo-vet-exemptions.py

  e2e:
    name: Disposable E2E
    runs-on: ubuntu-24.04
    steps:
      - run: "echo 'FAIL: disposable E2E runner is not implemented yet' >&2; exit 1"

  failure_injection:
    name: Disposable failure injection
    runs-on: ubuntu-24.04
    steps:
      - run: "echo 'FAIL: disposable failure-injection runner is not implemented yet' >&2; exit 1"

  validation_tests:
    name: Validation tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 scripts/tests/test-cargo-vet-exemptions.py
      - run: python3 scripts/tests/test_ci_policy.py
      - run: bash scripts/tests/failure-injection-contract-test.sh
      - run: ruby scripts/tests/security-workflow-test.rb
      - run: ruby scripts/tests/offline_container_policy_test.rb
      - run: python3 -B scripts/tests/test_receive_orchestrator_artifacts.py

  required:
    name: Required validation result
    if: ${{ always() }}
    needs: [rust, supabase, orchestrator, orchestrator_postgres, cargo_deny, cargo_vet, e2e, failure_injection, validation_tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation job to succeed
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          SUPABASE_RESULT: ${{ needs.supabase.result }}
          ORCHESTRATOR_RESULT: ${{ needs.orchestrator.result }}
          ORCHESTRATOR_POSTGRES_RESULT: ${{ needs.orchestrator_postgres.result }}
          CARGO_DENY_RESULT: ${{ needs.cargo_deny.result }}
          CARGO_VET_RESULT: ${{ needs.cargo_vet.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          FAILURE_INJECTION_RESULT: ${{ needs.failure_injection.result }}
          VALIDATION_TESTS_RESULT: ${{ needs.validation_tests.result }}
        run: |
          test "$RUST_RESULT" = success &&
          test "$SUPABASE_RESULT" = success &&
          test "$ORCHESTRATOR_RESULT" = success &&
          test "$ORCHESTRATOR_POSTGRES_RESULT" = success &&
          test "$CARGO_DENY_RESULT" = success &&
          test "$CARGO_VET_RESULT" = success &&
          test "$E2E_RESULT" = success &&
          test "$FAILURE_INJECTION_RESULT" = success &&
          test "$VALIDATION_TESTS_RESULT" = success
