name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
          key: ${{ runner.os }}-cargo-1.95-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.95-
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy && rustup default 1.95.0
      - run: bash scripts/check-core.sh rust

  supabase:
    name: Supabase validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@d239d1052f6f024a8d746d7e5aeddead63b9cb53 # v3.1.0
        with:
          # Keep CLI v2 until supabase/config.toml migrates from [inbucket] to [local_smtp].
          version: 2.122.1
      - run: supabase start > /dev/null
      - run: bash scripts/check-core.sh db

  security:
    name: Security validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: toolchain
        run: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0
      - id: install_deny
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: cargo install --locked cargo-deny --version 0.20.2
      - id: deny
        if: ${{ always() && steps.install_deny.outcome == 'success' }}
        run: cargo deny --locked check
      - id: install_vet
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: cargo install --locked cargo-vet --version 0.10.2
      - id: vet
        if: ${{ always() && steps.install_vet.outcome == 'success' }}
        run: cargo vet --locked --no-minimize-exemptions
      - name: Summarize security checks
        if: ${{ always() }}
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          INSTALL_DENY_OUTCOME: ${{ steps.install_deny.outcome }}
          DENY_OUTCOME: ${{ steps.deny.outcome }}
          INSTALL_OUTCOME: ${{ steps.install_vet.outcome }}
          VET_OUTCOME: ${{ steps.vet.outcome }}
        run: |
          {
            echo '## Security validation'
            echo "Checkout: ${CHECKOUT_OUTCOME:-not run}; toolchain: ${TOOLCHAIN_OUTCOME:-not run}."
            echo "cargo-deny installation: ${INSTALL_DENY_OUTCOME:-not run}; check: ${DENY_OUTCOME:-not run}."
            echo "cargo-vet installation: ${INSTALL_OUTCOME:-not run}; check: ${VET_OUTCOME:-not run}."
            echo 'See the individual step logs for check output.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Require both security checks
        if: ${{ always() }}
        env:
          DENY_OUTCOME: ${{ steps.deny.outcome }}
          VET_OUTCOME: ${{ steps.vet.outcome }}
        run: test "$DENY_OUTCOME" = success && test "$VET_OUTCOME" = success
