name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
          key: ${{ runner.os }}-cargo-1.95-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.95-
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy && rustup default 1.95.0
      - run: bash scripts/check-core.sh rust

  supabase:
    name: Supabase validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@d239d1052f6f024a8d746d7e5aeddead63b9cb53 # v3.1.0
        with:
          # Keep CLI v2 until supabase/config.toml migrates from [inbucket] to [local_smtp].
          version: 2.122.1
      - run: supabase start > /dev/null
      - run: bash scripts/check-core.sh db

  security:
    name: Security validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo deny --locked check

  cargo-vet:
    name: cargo-vet (informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: toolchain
        run: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0
      - id: install_vet
        run: cargo install --locked cargo-vet --version 0.10.2
      - id: vet
        run: cargo vet --locked --no-minimize-exemptions 2>&1 | tee "$RUNNER_TEMP/cargo-vet.log"
      - name: Summarize cargo-vet
        if: ${{ always() }}
        env:
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          INSTALL_OUTCOME: ${{ steps.install_vet.outcome }}
          VET_OUTCOME: ${{ steps.vet.outcome }}
        run: |
          {
            echo '## cargo-vet (informational)'
            echo "Toolchain: ${TOOLCHAIN_OUTCOME:-not run}; installation: ${INSTALL_OUTCOME:-not run}; check: ${VET_OUTCOME:-not run}."
            if [ "$VET_OUTCOME" = success ]; then
              echo 'The cargo-vet check passed.'
            elif [ "$VET_OUTCOME" = failure ]; then
              if grep -q 'unvetted dependencies:' "$RUNNER_TEMP/cargo-vet.log"; then
                echo 'The check failed with unvetted dependencies. See the output below for counts and details.'
              else
                echo 'The check failed. See the output below for the cause.'
              fi
            else
              echo 'The check did not run. See the setup step logs for the cause.'
            fi
            if [ -f "$RUNNER_TEMP/cargo-vet.log" ]; then
              printf '\n<details><summary>cargo-vet output</summary>\n\n```text\n'
              cat "$RUNNER_TEMP/cargo-vet.log"
              printf '\n```\n</details>\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
