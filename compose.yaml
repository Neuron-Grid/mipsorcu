services:
    mipsorcu:
        build:
            context: .
        image: mipsorcu:local
        env_file:
            - path: .env
              required: false
        environment:
            MIPSORCU_LISTEN_ADDR: "0.0.0.0:3000"
        volumes:
            - ./mipsorcu-data:/var/lib/mipsorcu
        ports:
            - "127.0.0.1:3000:3000"
        restart: unless-stopped
        deploy:
            replicas: 1
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

volumes:
    mipsorcu-data:
        name: mipsorcu-data
