worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    add_header_inherit merge;

    map $uri $content_security_policy {
        default "default-src 'self'; script-src 'self'; style-src 'self' https://cdnjs.cloudflare.com; connect-src 'self' https: http://127.0.0.1:* http://localhost:*; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";

        /robots.txt "default-src 'none'; frame-ancestors 'none'";
    }

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_min_length 1024;
        gzip_types
            application/javascript
            application/json
            image/svg+xml
            text/css
            text/plain;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $content_security_policy always;

        location = /robots.txt {
            default_type text/plain;
            add_header Cache-Control "no-store" always;

            limit_except GET {
                deny all;
            }

            return 200 "User-agent: *\nDisallow: /\n";
        }

        location = /healthz {
            access_log off;
            default_type text/plain;

            limit_except GET {
                deny all;
            }

            return 200 "ok\n";
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;

            limit_except GET {
                deny all;
            }

            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-store" always;

            limit_except GET {
                deny all;
            }

            try_files /index.html =404;
        }

        location / {
            add_header Cache-Control "no-store" always;

            limit_except GET {
                deny all;
            }

            try_files $uri $uri/ /index.html;
        }
    }
}
